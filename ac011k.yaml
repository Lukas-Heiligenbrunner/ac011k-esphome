# ac011k.yaml
# ESPHome configuration for the EN+ / Autoaid AC011K EV charger.
#
# Flash command (serial, board in flash mode — connect GPIO0 to GND):
#   esptool.py --chip esp32 --baud 921600 --port /dev/ttyUSBx \
#     --before default_reset --after hard_reset write_flash 0x0 ac011k.bin
# Subsequent updates: esphome run ac011k.yaml  (OTA)
#
# Charging control:
#   - "Target Current" (A) is the primary control, sent directly to the GD32 via 0xAF.
#   - Charger always runs 3-phase (phase switching via PrivComm cmd 0x52 is
#     not functional on this hardware — GD32 ignores it).
#   - Auto-Start: when enabled the charger starts automatically on plug-in.
#
# Current limits: 6 A (min) … 16 A (max) per phase

esphome:
  name: ac011k-charger
  friendly_name: "EN+ AC011K EV Charger"
  name_add_mac_suffix: true

esp32:
  board: esp32dev
  framework:
    type: esp-idf

psram:
  mode: quad   # ESP32-D0WD: quad-SPI PSRAM
  speed: 40MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  tx_buffer_size: 2048

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  post_connect_roaming: true
  ap:
    ssid: "ac011k-fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 8080
  local: true

#ethernet:
#  type: IP101          # Firmware confirmed: esp_eth_phy_new_ip101 (was LAN8720)
#  mdc_pin: GPIO23      # Confirmed: eth_mac_config_t in DROM at 0x3f4bac40
#  mdio_pin: GPIO18     # Confirmed: eth_mac_config_t in DROM at 0x3f4bac44
#  clk_mode: GPIO0_IN   # External oscillator; no evidence of CLK output mode
#  phy_addr: 1          # Firmware uses auto-detect (-1); PHY typically found at 1
#  power_pin: GPIO5     # Confirmed: eth_phy_config_t reset_gpio_num=5 at 0x3f4bac58

# NTP — GD32 requests UTC time on every heartbeat.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin   # adjust to your timezone

# ── PrivComm UART ──────────────────────────────────────────────────────────────
uart:
  id: privcomm_uart
  tx_pin: GPIO32   # Confirmed: uart_set_pin(UART1, tx=32, rx=34) at 0x4014633D in firmware
  rx_pin: GPIO34   # Confirmed: GPIO34 is input-only, correct for RX
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 1024

# ── AC011K hub ─────────────────────────────────────────────────────────────────
ac011k:
  id: ac011k_hub
  uart_id: privcomm_uart

# ── Globals ────────────────────────────────────────────────────────────────────
globals:
  - id: auto_start_ticks   # counts 10s intervals with enough excess while not charging
    type: int
    initial_value: '0'
  - id: auto_stop_ticks    # counts 10s intervals with insufficient excess while charging
    type: int
    initial_value: '0'

# ── Meter sensors ──────────────────────────────────────────────────────────────
sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    power:
      name: "Charger Power"
      id: charger_power
    voltage_l1:
      name: "Charger L1 Voltage"
    voltage_l2:
      name: "Charger L2 Voltage"
    voltage_l3:
      name: "Charger L3 Voltage"
    current_l1:
      name: "Charger L1 Current"
    current_l2:
      name: "Charger L2 Current"
    current_l3:
      name: "Charger L3 Current"
    energy_session:
      name: "Charger Session Energy"
    energy_total:
      name: "Charger Total Energy"
    evse_status:
      name: "Charger EVSE Status"
      entity_category: diagnostic
      # 1=Available  2=Preparing(plugged)  3=Charging  4=Suspended by charger
      # 5=Suspended by EV  6=Finishing  7=Reserved  8=Unavailable  9=Fault
    phases_connected:
      name: "Charger Active Phases"
      entity_category: diagnostic
      icon: mdi:sine-wave
      # Phases with voltage > 70 V in 0x08 meter data. Updates during charging only.

  # ── Home Assistant sensors ───────────────────────────────────────────────────
  - platform: homeassistant
    id: grid_power
    entity_id: sensor.shellypro3em_8813bfda0cc8_total_active_power
    name: "Grid Power"
    unit_of_measurement: "W"
    icon: mdi:transmission-tower
    # Positive = importing from grid, negative = exporting (excess solar)

  - platform: template
    name: "Solar Excess Power"
    id: solar_excess_power
    unit_of_measurement: "W"
    icon: mdi:solar-power-variant
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(grid_power).state)) return NAN;
      float c = isnan(id(charger_power).state) ? 0.0f : id(charger_power).state;
      return c - id(grid_power).state - 500.0f;
      // Note: "enough to start" = this value >= 6A * phases * 230V

# ── EVSE state text sensor ─────────────────────────────────────────────────────
text_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    evse_state:
      name: "Charger EVSE State"
      entity_category: diagnostic
      icon: mdi:ev-station

# ── State binary sensors ───────────────────────────────────────────────────────
binary_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    plugged:
      name: "Charger Cable Plugged"
      id: ev_plugged
      on_press:
        # Auto-start: when cable is inserted and auto-start is enabled AND solar auto mode
        # is off, start charging immediately at target_current.
        # In solar auto mode the interval handles start/stop instead.
        - if:
            condition:
              and:
                - switch.is_on: auto_start_switch
                - switch.is_off: solar_auto_mode
            then:
              - delay: 1500ms
              - script.execute: apply_charging_settings
              - lambda: 'id(ac011k_hub).start_charging();'
        - if:
            condition:
              switch.is_on: solar_auto_mode
            then:
              # Reset hysteresis counters so the 30s window starts fresh on plug-in
              - lambda: |-
                  id(auto_start_ticks) = 0;
                  id(auto_stop_ticks)  = 0;
    charging:
      name: "Charger Charging Active"
      id: ev_charging
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "PCB Button"

  # NOTE: GPIO32 is UART1 TX (confirmed from firmware), so it cannot be used as a button.
  # GPIO34 is UART1 RX. The physical button GPIO is unknown — needs hardware tracing.
  # - platform: gpio
  #   name: "Charger Button"
  #   pin:
  #     number: GPIO32   # WRONG: this is UART1 TX
  #     inverted: true
  #     mode:
  #       input: true
  #       pullup: true

# ── Controls ───────────────────────────────────────────────────────────────────

switch:
  # Toggle: automatically start charging when cable is plugged in (manual mode only).
  - platform: template
    name: "Auto-Start Charging"
    id: auto_start_switch
    icon: mdi:ev-plug-type2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Toggle: solar excess auto mode. Overrides manual start/stop and adjusts current
  # to match available excess power (Shelly 3EM), with a 500 W safety buffer.
  - platform: template
    name: "Solar Auto Charging"
    id: solar_auto_mode
    icon: mdi:solar-power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      # Reset hysteresis counters when mode is enabled
      - lambda: |-
          id(auto_start_ticks) = 0;
          id(auto_stop_ticks)  = 0;
    turn_off_action:
      # Stop charging when leaving auto mode so the user decides manually
      - if:
          condition:
            binary_sensor.is_on: ev_charging
          then:
            - lambda: 'id(ac011k_hub).stop_charging();'


select:
  - platform: template
    name: "Installed Phases"
    id: installed_phases
    icon: mdi:sine-wave
    options:
      - "1"
      - "3"
    initial_option: "3"
    optimistic: true
    restore_value: true

number:
  - platform: template
    name: "Target Charging Current"
    id: target_current
    unit_of_measurement: "A"
    icon: mdi:current-ac
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: true
    set_action:
      - lambda: 'id(target_current).publish_state(x);'
      - script.execute: apply_charging_settings

button:
  - platform: template
    name: "Start Charging"
    icon: mdi:play-circle
    on_press:
      - if:
          condition:
            binary_sensor.is_off: ev_charging
          then:
            - script.execute: apply_charging_settings
            - lambda: 'id(ac011k_hub).start_charging();'

  - platform: template
    name: "Stop Charging"
    icon: mdi:stop-circle
    on_press:
      - if:
          condition:
            binary_sensor.is_on: ev_charging
          then:
            - lambda: 'id(ac011k_hub).stop_charging();'

# ── Solar auto-charge interval ─────────────────────────────────────────────────
interval:
  - interval: 10s
    then:
      - lambda: |-
          if (!id(solar_auto_mode).state) return;
          if (isnan(id(grid_power).state))  return;  // no HA connection yet

          const float buffer_w = 500.0f;
          const float v_total  = 230.0f * (id(installed_phases).state == "1" ? 1.0f : 3.0f);
          const int   min_a    = 6;
          const int   max_a    = 16;
          
          // 3 ticks × 10 s = 30 s hysteresis
          const int   hyst_start = 6;   // 60 seconds
          const int   hyst_stop  = 24;  // 240 seconds (4 minutes)

          float c = isnan(id(charger_power).state) ? 0.0f : id(charger_power).state;
          // available = solar surplus available to the charger, after buffer
          float available = c - id(grid_power).state - buffer_w;
          int target_a = (int)(available / v_total);
          
          // Clamp target current
          if (target_a < min_a) target_a = min_a;
          if (target_a > max_a) target_a = max_a;

          bool enough   = available >= (float)min_a * v_total;
          bool charging = id(ev_charging).state;
          bool plugged  = id(ev_plugged).state;

          if (!plugged) {
            id(auto_start_ticks) = 0;
            id(auto_stop_ticks)  = 0;
            return;
          }

          if (!charging && enough) {
            id(auto_stop_ticks)  = 0; // Reset stop counter
            id(auto_start_ticks)++;
          
            ESP_LOGI("solar", "Start timer: %ds/%ds | Available: %.0fW", 
                     id(auto_start_ticks) * 10, hyst_start * 10, available);

            if (id(auto_start_ticks) >= hyst_start) {
              id(auto_start_ticks) = 0;
              id(ac011k_hub).set_phases(3);
              id(ac011k_hub).set_current_limit((uint8_t)target_a);
              id(ac011k_hub).start_charging();
              ESP_LOGW("solar", "Hysteresis met: Starting Charge.");
            }
          }
          else if (charging && !enough) {
            id(auto_start_ticks) = 0; // Reset start counter
            id(auto_stop_ticks)++;
          
            ESP_LOGI("solar", "Stop timer: %ds/%ds | Shortage: %.0fW", 
                     id(auto_stop_ticks) * 10, hyst_stop * 10, (available - (min_a * v_total)));

            if (id(auto_stop_ticks) >= hyst_stop) {
              id(auto_stop_ticks) = 0;
              id(ac011k_hub).stop_charging();
              ESP_LOGW("solar", "Hysteresis met: Stopping Charge.");
            }
          } 
          else if (charging && enough) {
            id(auto_start_ticks) = 0;
            id(auto_stop_ticks)  = 0;
            id(ac011k_hub).set_phases(3);
            id(ac011k_hub).set_current_limit((uint8_t)target_a);
          } 
          else {
            id(auto_start_ticks) = 0;
            id(auto_stop_ticks)  = 0;
          }

# ── Core logic script ──────────────────────────────────────────────────────────
script:
  - id: apply_charging_settings
    then:
      - lambda: |-
          uint8_t amps = (uint8_t) id(target_current).state;
          ESP_LOGI("ac011k", "apply: %d A", amps);
          id(ac011k_hub).set_phases(3);
          id(ac011k_hub).set_current_limit(amps);

# ac011k.yaml
# ESPHome configuration for the EN+ / Autoaid AC011K EV charger.
#
# Flash command (serial, board in flash mode — connect GPIO0 to GND):
#   esptool.py --chip esp32 --baud 921600 --port /dev/ttyUSBx \
#     --before default_reset --after hard_reset write_flash 0x0 ac011k.bin
# Subsequent updates: esphome run ac011k.yaml  (OTA)
#
# Charging control:
#   - "Target Current" (A) is the primary control, sent directly to the GD32 via 0xAF.
#   - Charger always runs 3-phase (phase switching via PrivComm cmd 0x52 is
#     not functional on this hardware — GD32 ignores it).
#   - Auto-Start: when enabled the charger starts automatically on plug-in.
#
# Current limits: 6 A (min) … 16 A (max) per phase

esphome:
  name: ac011k-charger
  friendly_name: "EN+ AC011K EV Charger"
  name_add_mac_suffix: true
  project:
    name: esphome.ac011k-charger
    version: "1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

psram:
  mode: quad   # ESP32-D0WD: quad-SPI PSRAM
  speed: 40MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  tx_buffer_size: 2048

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ac011k-fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 8080
  local: true

#ethernet:
#  type: IP101          # Firmware confirmed: esp_eth_phy_new_ip101 (was LAN8720)
#  mdc_pin: GPIO23      # Confirmed: eth_mac_config_t in DROM at 0x3f4bac40
#  mdio_pin: GPIO18     # Confirmed: eth_mac_config_t in DROM at 0x3f4bac44
#  clk_mode: GPIO0_IN   # External oscillator; no evidence of CLK output mode
#  phy_addr: 1          # Firmware uses auto-detect (-1); PHY typically found at 1
#  power_pin: GPIO5     # Confirmed: eth_phy_config_t reset_gpio_num=5 at 0x3f4bac58

# NTP — GD32 requests UTC time on every heartbeat.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin   # adjust to your timezone

# ── PrivComm UART ──────────────────────────────────────────────────────────────
uart:
  id: privcomm_uart
  tx_pin: GPIO32   # Confirmed: uart_set_pin(UART1, tx=32, rx=34) at 0x4014633D in firmware
  rx_pin: GPIO34   # Confirmed: GPIO34 is input-only, correct for RX
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 1024

# ── AC011K hub ─────────────────────────────────────────────────────────────────
ac011k:
  id: ac011k_hub
  uart_id: privcomm_uart

# ── Meter sensors ──────────────────────────────────────────────────────────────
sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    power:
      name: "Charger Power"
      id: charger_power
    voltage_l1:
      name: "Charger L1 Voltage"
    voltage_l2:
      name: "Charger L2 Voltage"
    voltage_l3:
      name: "Charger L3 Voltage"
    current_l1:
      name: "Charger L1 Current"
    current_l2:
      name: "Charger L2 Current"
    current_l3:
      name: "Charger L3 Current"
    energy_session:
      name: "Charger Session Energy"
    energy_total:
      name: "Charger Total Energy"
    evse_status:
      name: "Charger EVSE Status"
      entity_category: diagnostic
      # 1=Available  2=Preparing(plugged)  3=Charging  4=Suspended by charger
      # 5=Suspended by EV  6=Finishing  7=Reserved  8=Unavailable  9=Fault
    phases_connected:
      name: "Charger Active Phases"
      entity_category: diagnostic
      icon: mdi:sine-wave
      # Phases with voltage > 70 V in 0x08 meter data. Updates during charging only.

# ── EVSE state text sensor ─────────────────────────────────────────────────────
text_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    evse_state:
      name: "Charger EVSE State"
      entity_category: diagnostic
      icon: mdi:ev-station

# ── State binary sensors ───────────────────────────────────────────────────────
binary_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    plugged:
      name: "Charger Cable Plugged"
      id: ev_plugged
      on_press:
        # Auto-start: when cable is inserted and auto-start is enabled, start charging.
        # Small delay gives GD32 time to settle in "Preparing" state.
        - if:
            condition:
              switch.is_on: auto_start_switch
            then:
              - delay: 1500ms
              - script.execute: apply_charging_settings
              - lambda: 'id(ac011k_hub).start_charging();'
    charging:
      name: "Charger Charging Active"
      id: ev_charging
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "PCB Button"

  # NOTE: GPIO32 is UART1 TX (confirmed from firmware), so it cannot be used as a button.
  # GPIO34 is UART1 RX. The physical button GPIO is unknown — needs hardware tracing.
  # - platform: gpio
  #   name: "Charger Button"
  #   pin:
  #     number: GPIO32   # WRONG: this is UART1 TX
  #     inverted: true
  #     mode:
  #       input: true
  #       pullup: true

# ── Controls ───────────────────────────────────────────────────────────────────

switch:
  # Toggle: automatically start charging when cable is plugged in.
  - platform: template
    name: "Auto-Start Charging"
    id: auto_start_switch
    icon: mdi:ev-plug-type2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


number:
  - platform: template
    name: "Target Charging Current"
    id: target_current
    unit_of_measurement: "A"
    icon: mdi:current-ac
    min_value: 6
    max_value: 16
    step: 1
    initial_value: 16
    optimistic: true
    restore_value: true
    set_action:
      - lambda: 'id(target_current).publish_state(x);'
      - script.execute: apply_charging_settings

button:
  - platform: template
    name: "Start Charging"
    icon: mdi:play-circle
    on_press:
      - if:
          condition:
            binary_sensor.is_off: ev_charging
          then:
            - script.execute: apply_charging_settings
            - lambda: 'id(ac011k_hub).start_charging();'

  - platform: template
    name: "Stop Charging"
    icon: mdi:stop-circle
    on_press:
      - if:
          condition:
            binary_sensor.is_on: ev_charging
          then:
            - lambda: 'id(ac011k_hub).stop_charging();'

# ── Core logic script ──────────────────────────────────────────────────────────
script:
  - id: apply_charging_settings
    then:
      - lambda: |-
          uint8_t amps = (uint8_t) id(target_current).state;
          ESP_LOGI("ac011k", "apply: %d A", amps);
          id(ac011k_hub).set_phases(3);
          id(ac011k_hub).set_current_limit(amps);

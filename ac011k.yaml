# ac011k.yaml
# ESPHome configuration for the EN+ / Autoaid AC011K EV charger.
#
# Flash command (serial, board in flash mode — connect GPIO0 to GND):
#   esptool.py --chip esp32 --baud 921600 --port /dev/ttyUSBx \
#     --before default_reset --after hard_reset write_flash 0x0 ac011k.bin
# Subsequent updates: esphome run ac011k.yaml  (OTA)
#
# Power control logic:
#   - "Target Power" (W) is the primary control: it drives both phase selection
#     and per-phase current automatically.
#   - Phase Mode "Auto": ≤ 3680 W → 1-phase, > 3680 W → 3-phase.
#   - Phase Mode "1-Phase" / "3-Phase": forced, current calculated accordingly.
#   - Auto-Start: when enabled the charger starts automatically on plug-in.
#
# Phase / power limits (230 V grid):
#   1-phase:  6 A × 230 V =  1380 W  ...  16 A × 230 V =  3680 W
#   3-phase:  6 A × 690 V =  4140 W  ...  16 A × 690 V = 11040 W
#   (3-phase minimum requires > 3680 W target in Auto mode)

esphome:
  name: ac011k-charger
  friendly_name: "EN+ AC011K EV Charger"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

psram:
  mode: quad   # ESP32-D0WD: quad-SPI PSRAM
  speed: 40MHz

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  tx_buffer_size: 2048

api:
  encryption:
    key: !secret ha_api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ac011k-fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 8080
  local: true

#ethernet:
#  type: IP101          # Firmware confirmed: esp_eth_phy_new_ip101 (was LAN8720)
#  mdc_pin: GPIO23      # Confirmed: eth_mac_config_t in DROM at 0x3f4bac40
#  mdio_pin: GPIO18     # Confirmed: eth_mac_config_t in DROM at 0x3f4bac44
#  clk_mode: GPIO0_IN   # External oscillator; no evidence of CLK output mode
#  phy_addr: 1          # Firmware uses auto-detect (-1); PHY typically found at 1
#  power_pin: GPIO5     # Confirmed: eth_phy_config_t reset_gpio_num=5 at 0x3f4bac58

# NTP — GD32 requests UTC time on every heartbeat.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin   # adjust to your timezone

# ── PrivComm UART ──────────────────────────────────────────────────────────────
uart:
  id: privcomm_uart
  tx_pin: GPIO32   # Confirmed: uart_set_pin(UART1, tx=32, rx=34) at 0x4014633D in firmware
  rx_pin: GPIO34   # Confirmed: GPIO34 is input-only, correct for RX
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE
  rx_buffer_size: 1024

# ── AC011K hub ─────────────────────────────────────────────────────────────────
ac011k:
  id: ac011k_hub
  uart_id: privcomm_uart

# ── Meter sensors ──────────────────────────────────────────────────────────────
sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    power:
      name: "Charger Power"
      id: charger_power
    voltage_l1:
      name: "Charger L1 Voltage"
    voltage_l2:
      name: "Charger L2 Voltage"
    voltage_l3:
      name: "Charger L3 Voltage"
    current_l1:
      name: "Charger L1 Current"
    current_l2:
      name: "Charger L2 Current"
    current_l3:
      name: "Charger L3 Current"
    energy_session:
      name: "Charger Session Energy"
    energy_total:
      name: "Charger Total Energy"
    evse_status:
      name: "Charger EVSE Status"
      entity_category: diagnostic
      # 1=Available  2=Preparing(plugged)  3=Charging  4=Suspended by charger
      # 5=Suspended by EV  6=Finishing  7=Reserved  8=Unavailable  9=Fault

# ── EVSE state text sensor ─────────────────────────────────────────────────────
text_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    evse_state:
      name: "Charger EVSE State"
      entity_category: diagnostic
      icon: mdi:ev-station

# ── State binary sensors ───────────────────────────────────────────────────────
binary_sensor:
  - platform: ac011k
    ac011k_id: ac011k_hub
    plugged:
      name: "Charger Cable Plugged"
      id: ev_plugged
      on_press:
        # Auto-start: when cable is inserted and auto-start is enabled, start charging.
        # Small delay gives GD32 time to settle in "Preparing" state.
        - if:
            condition:
              switch.is_on: auto_start_switch
            then:
              - delay: 1500ms
              - script.execute: apply_charging_settings
              - lambda: 'id(ac011k_hub).start_charging();'
    charging:
      name: "Charger Charging Active"
      id: ev_charging
  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "PCB Button"

  # NOTE: GPIO32 is UART1 TX (confirmed from firmware), so it cannot be used as a button.
  # GPIO34 is UART1 RX. The physical button GPIO is unknown — needs hardware tracing.
  # - platform: gpio
  #   name: "Charger Button"
  #   pin:
  #     number: GPIO32   # WRONG: this is UART1 TX
  #     inverted: true
  #     mode:
  #       input: true
  #       pullup: true

# ── Controls ───────────────────────────────────────────────────────────────────

switch:
  # Toggle: automatically start charging when cable is plugged in.
  - platform: template
    name: "Auto-Start Charging"
    id: auto_start_switch
    icon: mdi:ev-plug-type2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

select:
  # Phase mode: Auto switches at the 3680 W boundary (16 A × 1φ × 230 V).
  - platform: template
    name: "Phase Mode"
    id: phase_mode_select
    icon: mdi:sine-wave
    options:
      - "Auto"
      - "1-Phase"
      - "3-Phase"
    initial_option: "Auto"
    optimistic: true
    restore_value: true
    set_action:
      # x is the newly selected option; state is not yet committed when set_action runs,
      # so publish it first so current_option() is correct when the script reads it.
      - lambda: 'id(phase_mode_select).publish_state(x);'
      - script.execute: apply_charging_settings

number:
  # Target charging power in watts. Drives phase selection + per-phase current.
  - platform: template
    name: "Target Charging Power"
    id: target_power
    unit_of_measurement: "W"
    icon: mdi:flash
    min_value: 1380    # 6 A × 230 V (1-phase minimum)
    max_value: 11040   # 16 A × 690 V (3-phase maximum)
    step: 100
    initial_value: 3680  # 16 A × 1-phase — safe default for all setups
    optimistic: true
    restore_value: true
    set_action:
      - lambda: 'id(target_power).publish_state(x);'
      - script.execute: apply_charging_settings

button:
  - platform: template
    name: "Start Charging"
    icon: mdi:play-circle
    on_press:
      - script.execute: apply_charging_settings
      - lambda: 'id(ac011k_hub).start_charging();'

  - platform: template
    name: "Stop Charging"
    icon: mdi:stop-circle
    on_press:
      - lambda: 'id(ac011k_hub).stop_charging();'

# ── Core logic script ──────────────────────────────────────────────────────────
# Calculates phase count and per-phase amperes from target_power + phase_mode_select,
# then pushes both to the GD32 over PrivComm.
#
# Auto-mode boundary: 3680 W = 16 A × 1φ × 230 V
#   ≤ 3680 W → 1-phase,  amps = power / 230        (clamped 6–16 A)
#   > 3680 W → 3-phase,  amps = power / (3 × 230)  (clamped 6–16 A)
#
# Note: switching phases during an active session is supported by the GD32 firmware
# (cmdAACtrlSetChgphase / AA 18 52). The GD32 handles the hardware transition.
script:
  - id: apply_charging_settings
    then:
      - lambda: |-
          float power = id(target_power).state;
          std::string mode = id(phase_mode_select).current_option();

          ESP_LOGI("ac011k", "apply_charging_settings called: power=%.0fW mode=%s",
                   power, mode.c_str());

          uint8_t phases;
          float amps_f;

          if (mode == "1-Phase") {
              phases  = 1;
              amps_f  = power / 230.0f;
          } else if (mode == "3-Phase") {
              phases  = 3;
              amps_f  = power / (3.0f * 230.0f);
          } else {
              // Auto: use 1-phase up to the 16 A limit, then switch to 3-phase
              if (power <= 3680.0f) {
                  phases = 1;
                  amps_f = power / 230.0f;
              } else {
                  phases = 3;
                  amps_f = power / (3.0f * 230.0f);
              }
          }

          uint8_t amps = (uint8_t) std::max(6.0f, std::min(16.0f, amps_f));
          ESP_LOGI("ac011k", "apply: %.0f W  mode=%s  -> %d-phase @ %d A",
                   power, mode.c_str(), phases, amps);
          id(ac011k_hub).set_phases(phases);
          id(ac011k_hub).set_current_limit(amps);
